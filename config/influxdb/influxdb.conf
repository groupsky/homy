reporting-disabled = true

[meta]
  dir = "/var/lib/influxdb/meta"

[data]
  dir = "/var/lib/influxdb/data"
  engine = "tsm1"
  wal-dir = "/var/lib/influxdb/wal"
  # Each query is already in the HTTP access log ([httpd]), with client and
  # status, so the second "Executing query" line is only log volume (#1711).
  query-log-enabled = false
