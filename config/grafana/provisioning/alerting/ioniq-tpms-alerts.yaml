              resultFormat: time_series
          - refId: A
            datasourceUid: __expr__
            model:
              type: classic_conditions
              datasource: { type: __expr__, uid: __expr__ }
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              hide: false
              conditions:
                - evaluator: { type: lt, params: [1.90] }
                  operator: { type: and }
                  query: { params: [q] }
                  reducer: { type: last }
                  type: query
              expression: q
        noDataState: OK
        execErrState: OK
        for: 0s
        labels: { severity: critical, device: ioniq, subsystem: tpms }
        annotations:
          summary: "🚗 FL (front-left) tyre cold-start pressure below 1.90 bar"
          description: "Front-left tyre read under 1.90 bar on at least one cold reading in the last 7 days (placard 2.5 bar, defined at ambient). Do not drive far — inflate or replace now to avoid tyre damage. Clears only once every cold reading in the trailing 7 days is above 1.90 bar, so expect it to persist for about a week after inflating — a single warm morning must not be able to report the tyre as fixed."

      - uid: ioniq-tpms-fl-overinflated
        title: "🚗 Ioniq Tyre Over-inflated — FL"
        condition: A
        data:
          - refId: q
            relativeTimeRange: { from: 21600, to: 0 }
            datasourceUid: P3C6603E967DC8568
            model:
              query: |
                SELECT last("value") FROM "ioniq"
                WHERE "group"='derived/tire_fl_bar_cold' AND time >= now() - 6h
              rawQuery: true
              resultFormat: time_series
          - refId: A
            datasourceUid: __expr__
            model:
              type: classic_conditions
              datasource: { type: __expr__, uid: __expr__ }
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              hide: false
              conditions:
                - evaluator: { type: gt, params: [2.90] }
                  operator: { type: and }
                  query: { params: [q] }
                  reducer: { type: last }
                  type: query
              expression: q
        noDataState: OK
        execErrState: OK
        for: 0s
        labels: { severity: info, device: ioniq, subsystem: tpms }
        annotations:
          summary: "🚗 FL (front-left) tyre cold-pressure above 2.90 bar"
          description: "Cold-normalized front-left tyre pressure is high (over 2.90 bar). Consider bleeding down toward the 2.5 bar placard for ride and wear."

      - uid: ioniq-tpms-fl-temp-excess
        title: "🚗 Ioniq Tyre Hot — FL"
        condition: A
        data:
          - refId: q
            relativeTimeRange: { from: 21600, to: 0 }
            datasourceUid: P3C6603E967DC8568
