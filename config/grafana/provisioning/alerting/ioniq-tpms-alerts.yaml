apiVersion: 1

# Two different signals are alerted on here, and the difference is the whole
# point of issue #1479.
#
# UNDER-INFLATION (`-psi-low`, `-psi-crit`) reads `derived/tire_<w>_bar_coldstart`
# — one point per wheel per morning, taken by the bot from the first fresh TPMS
# frame after a >= 6 h park and published raw. Two reasons it is not the
# normalised series:
#   1. The placard is defined at *ambient*. The normalised series is referenced
#      to 15 °C, so it is off by the gap between the two — ~0.12 bar low at a
#      25 °C August ambient, ~0.19 bar high at 0 °C in January. The rule was
#      therefore loudest in the season pressures do not fall and quietest in the
#      one they do. A coldstart reading needs no reference: the tyre has
#      equilibrated with ambient overnight, so it is comparable as measured.
#   2. The normalised series is republished on every fresh frame (median 46 s
#      apart) while the car is awake, and FR and RL sit within 0.02 bar of the
#      trip point — less than one TPMS quantisation step (0.2 psi = 0.014 bar).
#      It crossed and re-crossed the line several times per drive. Replayed over
#      the 27.5 days of production history to 2026-08-10 (3564 frames), the old
#      rule produced **22 fire/resolve pairs inside a single wake cycle**; the
#      coldstart rule produces **0**, at every threshold swept from 1.79 to 2.30
#      bar in 0.01 steps.
#
# Aggregation: `min()`, not `last()`, and this is deliberate. One point per
# morning kills the *intra-drive* flapping outright, but it does not make the
# signal steady: a cold-start reading is referenced to that night's ambient, and
# regressed against tyre temperature over the 26 mornings it moves 0.011 bar/°C
# at R² ~= 0.77. Overnight tyre temperature ranged 16-35 °C, so each wheel swings
# 0.18-0.22 bar across a summer while the permeation the alert exists to catch is
# under 0.09 bar/month. With `last()` that put FR either side of 2.20 repeatedly:
# **7 fires and 7 resolves in 27 days on tyres nobody touched**, six of those
# resolves telling the owner it was fixed when it was not. `min()` over the same
# 7 d window means a lone warm morning cannot clear the alert, and it drops to
# **2 fires and 0 resolves** — FR and RL each flagged once and staying flagged,
# which is the truth about those two tyres.
#
# Note this inverts the general rule in config/grafana/CLAUDE.md ("for an `lt`
# threshold use `max()`, so a lone outlier cannot drive the rule"). That rule
# guards against a lone low outlier *firing*. Here the fault is persistent
# under-inflation and the outliers are warm mornings reading *high*, so the
# expensive error is the false all-clear, not the extra page. `max()` over 7 d
# was measured too: it fires **0** times, muting FR and RL completely.
#
# EVERYTHING ELSE (`-overinflated`, `-spread-high`, `-temp-excess`) still reads
# the continuously-published series. Over-inflation is not a stranding risk and
# does not need the placard's precision; the spread and temperature rules are
# wheel-to-wheel differences, in which the reference temperature cancels.
#
# Thresholds. The low/critical pair is now chosen **in bar against the 2.5 bar
# placard**, not converted from a psi round number: 2.20 bar is 0.30 under
# placard and 1.90 bar is 0.60 under (~24 %). Replayed over the same 27.5 days
# with `min()`/7d: 2.20 fires twice — FR on 2026-07-23 and RL on 07-24, both
# still firing at the end of the window, because FR and RL really are ~0.28 bar
# under placard and that is what the issue set out to keep reporting. 1.90 fires
# 0 times, against an observed minimum of 2.137 bar on FR (2026-07-25). That is
# a measured count over one summer, not a claim that the critical rule cannot
# fire; re-check it after a winter, when defect 1 predicts pressures genuinely
# fall.
# The over-inflated and spread thresholds are still the old psi round numbers
# converted at 1 bar = 14.5038 psi and rounded to 2 decimals (42 -> 2.90,
# spread 3 -> 0.21), which shifts their trip points by 0.05-0.07 psi.
#
# Query windows. The coldstart rules use 7d, which is doing two jobs: it is the
# span the `min()` is taken over (so ~a week of readings must all be healthy to
# clear) and it is how long a reading stays visible. The rules that still read
# the continuous series keep 6h, because the car publishes TPMS only while awake
# (~138 of any 168 hours have no samples at all) and every rule here is
# noDataState: OK, so a short window would let the alert silently clear the
# moment the car sleeps.
#
# **What happens past 7 d of not driving**: the window empties, the rule goes
# NoData -> OK, and a firing alert auto-resolves with nothing fixed. That is
# accepted rather than overlooked — a tyre on a car that is not being driven is
# not a hazard, and the next drive republishes a cold start and re-fires within
# the minute. `ioniq-tpms-coldstart-stale` below is the rule that owns "I cannot
# see this data", per the one-staleness-rule-per-source pattern in
# config/grafana/CLAUDE.md. Note the Tires dashboard's stat tiles look back 30 d,
# so between day 8 and day 30 the tile still shows the last cold reading while
# these rules read Normal; the tile descriptions say so.
#
# `for:` is not a transient filter on any rule here — `SELECT min(...)`/`last(...)`
# over a long window keeps returning a value until the window turns over, see
# "last() Over a Long Window Defeats for:" in config/grafana/CLAUDE.md
# (issue #1419). The real artefact filters live in
# docker/automations/bots/ioniq-tpms.js: the wheel-freshness gate for
# temp_excess (issues #1415/#1416) and the coldstart gates for pressure (#1479).
#
# Residual, measured and accepted: the coldstart gate is "first start of the
# day", so on a day whose first drive is not in the morning it takes whatever
# the tyre has reached by then. That was 3 of the 26 days in the replay —
# 2026-07-25 17:01, 07-26 13:05 and 08-09 14:41 — and only the last was actually
# warm (32-34 °C). The other two were not: 07-25 at 17:01 was 16-19 °C and
# produced the *lowest* reading of the whole month (FR 2.137 bar). So the
# direction is not one-sided; an afternoon start can supply either the highest or
# the lowest reading of the week, and with `min()` a spurious low one holds the
# alert for 7 days. Gating on tyre-vs-ambient temperature would tighten this but
# would make the signal depend on an external sensor, which is what this design
# deliberately avoids.
#
# The 2.5 bar placard quoted in the annotations is not a conversion of anything
# here — 36 psi is 2.48 bar. 2.5 bar is the placard's own figure; the door label
# carries both, each rounded from 250 kPa independently.

groups:
  - orgId: 1
    name: Ioniq TPMS Alerts
    folder: Ioniq EV
    interval: 1m
    rules:
      - uid: ioniq-tpms-fl-psi-low
        title: "🚗 Ioniq Tyre Low — FL"
        condition: A
        data:
          - refId: q
            relativeTimeRange: { from: 604800, to: 0 }
            datasourceUid: P3C6603E967DC8568
            model:
              query: |
                SELECT min("value") FROM "ioniq"
                WHERE "group"='derived/tire_fl_bar_coldstart' AND time >= now() - 7d
              rawQuery: true
              resultFormat: time_series
          - refId: A
            datasourceUid: __expr__
            model:
              type: classic_conditions
              datasource: { type: __expr__, uid: __expr__ }
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              hide: false
              conditions:
                - evaluator: { type: lt, params: [2.20] }
                  operator: { type: and }
                  query: { params: [q] }
                  reducer: { type: last }
                  type: query
              expression: q
        noDataState: OK
        execErrState: OK
        for: 0s
        labels: { severity: warning, device: ioniq, subsystem: tpms }
        annotations:
          summary: "🚗 FL (front-left) tyre cold-start pressure below 2.20 bar"
          description: "Front-left tyre read under 2.20 bar on at least one cold reading in the last 7 days (placard 2.5 bar, defined at ambient). Inflate before the next drive; check for a slow leak. Clears only once every cold reading in the trailing 7 days is above 2.20 bar, so expect it to persist for about a week after inflating — a single warm morning must not be able to report the tyre as fixed."

      - uid: ioniq-tpms-fl-psi-crit
        title: "🚗 Ioniq Tyre Critical — FL"
        condition: A
        data:
          - refId: q
            relativeTimeRange: { from: 604800, to: 0 }
