      - uid: ioniq-tpms-rr-temp-excess
        title: "🚗 Ioniq Tyre Hot — RR"
        condition: A
        data:
          - refId: q
            relativeTimeRange: { from: 21600, to: 0 }
            datasourceUid: P3C6603E967DC8568
            model:
              query: |
                SELECT last("value") FROM "ioniq"
                WHERE "group"='derived/tire_rr_temp_excess' AND time >= now() - 6h
              rawQuery: true
              resultFormat: time_series
          - refId: A
            datasourceUid: __expr__
            model:
              type: classic_conditions
              datasource: { type: __expr__, uid: __expr__ }
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              hide: false
              conditions:
                - evaluator: { type: gt, params: [8] }
                  operator: { type: and }
                  query: { params: [q] }
                  reducer: { type: last }
                  type: query
              expression: q
        noDataState: OK
        execErrState: OK
        # A dragging brake or a failing bearing produces a sustained excess; a
        # transient step is a TPMS refresh artefact, not a fault (issue #1415).
        # Best-effort only -- see the note at the top of this file. It suppresses
        # an artefact that a corrective frame overwrites within 10 min (all three
        # historical cases), but not one that is the last value published before
        # the car sleeps.
        for: 10m
        labels: { severity: warning, device: ioniq, subsystem: tpms }
        annotations:
          summary: "🚗 RR (rear-right) tyre running hot vs the other wheels"
          description: "rear-right tyre is more than 8 °C hotter than the mean of the other three wheels. Check for a dragging brake, low pressure, or a failing bearing."

      # The eight under-inflation rules above are noDataState: OK + execErrState:
      # OK on a series that publishes roughly four points a day, so on their own
      # they are unfalsifiable: a broken producer, a renamed group tag, a wiped
      # persisted cache or a gate stuck closed all read exactly like four healthy
      # tyres. Under the old design the alerting series was the same one
      # publishing every ~46 s, so a producer fault showed within minutes; the
      # move to a once-a-day signal is what makes this rule necessary, and
      # config/grafana/CLAUDE.md asks for exactly one per data source.
      #
      # Floor arithmetic: 104 coldstart points in the 27.5 days to 2026-08-10,
      # the lowest any rolling 14-day window ever held was 48, and the longest
      # gap between consecutive points was 1.94 days. `lt 4` therefore fires only
      # when fewer than one full set of wheels reported in a fortnight — 12x
      # below the worst healthy window — so an ordinary two-week holiday does not
      # trip it and a producer fault does. Re-measure if the driving pattern
      # changes.
      - uid: ioniq-tpms-coldstart-stale
        title: "🚗 Ioniq TPMS Cold-Start Signal Stale"
        condition: A
        data:
          - refId: q
            relativeTimeRange: { from: 1209600, to: 0 }
            datasourceUid: P3C6603E967DC8568
            model:
              query: |
                SELECT count("value") FROM "ioniq"
                WHERE "group" =~ /^derived\/tire_(fl|fr|rl|rr)_bar_coldstart$/
                AND time >= now() - 14d
              rawQuery: true
              resultFormat: time_series
          - refId: A
            datasourceUid: __expr__
            model:
              type: classic_conditions
              datasource: { type: __expr__, uid: __expr__ }
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              hide: false
              conditions:
                - evaluator: { type: lt, params: [4] }
                  operator: { type: and }
                  query: { params: [q] }
                  reducer: { type: last }
                  type: query
              expression: q
        # This is the one rule here that must speak up when it cannot see data:
        # an empty 14-day window returns no rows rather than 0 (verified against
        # production), so the absence path has to be Alerting or the rule
        # silently never fires. Unlike the `min()`/`last()` rules above, `for:`
        # is a genuine transient filter here — a sliding count() re-counts the
        # window from scratch every tick, so a corrective point un-trips it.
        #
        # `for: 48h` rather than a couple of hours for one specific reason: on
        # the day this ships the series does not exist yet, so the rule starts
        # pending immediately and only clears when the first morning drive
        # publishes. 48 h covers that and an ordinary weekend of not driving.
        # The cost is detection latency on a real fault: 14 d for the window to
        # empty plus 2 d pending. That is the right trade for a backstop whose
        # job is "the producer died", not "the tyre is low".
        noDataState: Alerting
        execErrState: Alerting
        for: 48h
        labels: { severity: warning, device: ioniq, subsystem: tpms }
        annotations:
          summary: "🚗 No Ioniq tyre cold-start readings for two weeks"
          description: "Fewer than 4 cold-start pressure points across all four wheels in the last 14 days. Either the car has not been driven in a fortnight, or the ioniq-tpms bot has stopped publishing derived/tire_<w>_bar_coldstart — in which case the eight under-inflation rules are reading Normal because they see nothing, not because the tyres are fine. Check the automations service and the ioniq/parsed/tpms feed."

