apiVersion: 1

# Two different signals are alerted on here, and the difference is the whole
# point of issue #1479.
#
# UNDER-INFLATION (`-psi-low`, `-psi-crit`) reads `derived/tire_<w>_bar_coldstart`
# — one point per wheel per morning, taken by the bot from the first fresh TPMS
# frame after a >= 6 h park and published raw. Two reasons it is not the
# normalised series:
#   1. The placard is defined at *ambient*. The normalised series is referenced
#      to 15 °C, so it is off by the gap between the two — ~0.12 bar low at a
#      25 °C August ambient, ~0.19 bar high at 0 °C in January. The rule was
#      therefore loudest in the season pressures do not fall and quietest in the
#      one they do. A coldstart reading needs no reference: the tyre has
#      equilibrated with ambient overnight, so it is comparable as measured.
#   2. The normalised series is republished every ~30 s while the car is awake,
#      and FR and RL sit within 0.02 bar of the trip point — less than one TPMS
#      quantisation step (0.2 psi = 0.014 bar). It crossed and re-crossed the
#      line several times per drive. Replayed over the 27.4 days of production
#      history to 2026-08-10, the old rule produced **22 fire/resolve pairs
#      inside a single wake cycle**; the coldstart rule produces **0**, at every
#      threshold tried between 1.79 and 2.30 bar. One evaluation per morning
#      cannot flap, so no hysteresis and no `for:` bump are needed.
#
# EVERYTHING ELSE (`-overinflated`, `-spread-high`, `-temp-excess`) still reads
# the continuously-published series. Over-inflation is not a stranding risk and
# does not need the placard's precision; the spread and temperature rules are
# wheel-to-wheel differences, in which the reference temperature cancels.
#
# Thresholds. The low/critical pair is now chosen **in bar against the 2.5 bar
# placard**, not converted from a psi round number: 2.20 bar is 0.30 under
# placard and 1.90 bar is 0.60 under (~24 %). Replayed over the same 27.4 days:
# 2.20 fires 7 times (FR 4, RL 3) across 26 coldstart mornings — FR and RL
# really are ~0.28 bar under placard, which is what the issue set out to keep
# reporting — and 1.90 fires 0 times, against an observed minimum of 2.137 bar
# on FR (2026-07-25). That is a measured count over one summer, not a claim that
# the critical rule cannot fire; re-check it after a winter.
# The over-inflated and spread thresholds are still the old psi round numbers
# converted at 1 bar = 14.5038 psi and rounded to 2 decimals (42 -> 2.90,
# spread 3 -> 0.21), which shifts their trip points by 0.05-0.07 psi.
#
# Query windows. The coldstart rules use 7d: the series publishes once per
# driving day, so a 6h window would clear the alert by lunchtime and re-page the
# next morning, and 7d keeps the last known cold reading visible through a week
# of not driving. The rules that still read the continuous series keep 6h,
# because the car publishes TPMS only while awake (~138 of any 168 hours have no
# samples at all) and every rule here is noDataState: OK, so a short window would
# let the alert silently clear the moment the car sleeps.
#
# Either way `SELECT last(...)` keeps returning the newest point until a newer
# one arrives, so `for:` cannot be relied on as a transient filter -- see
# "last() Over a Long Window Defeats for:" in config/grafana/CLAUDE.md
# (issue #1419). The real artefact filters live in
# docker/automations/bots/ioniq-tpms.js: the wheel-freshness gate for
# temp_excess (issues #1415/#1416) and the coldstart gates for pressure (#1479).
#
# Residual, measured and accepted: the coldstart gate is "first start of the
# day", which on a day whose first drive is in the afternoon takes a sun-soaked
# tyre. That happened on 3 of 26 days in the replay (2026-07-25 17:01, 07-26
# 13:05, 08-09 14:41, the last at 32-34 °C). A warm reading is a *high* one, so
# it can only mute the alert, never invent one; it cost one cross-day
# clear/re-fire pair on FR (cleared 07-26 13:06 at 2.248, re-fired 07-27 08:08
# at 2.179). Gating on tyre-vs-ambient temperature would fix it but would make
# the signal depend on an external sensor, which is exactly what this design
# avoids.
#
# The 2.5 bar placard quoted in the annotations is not a conversion of anything
# here — 36 psi is 2.48 bar. 2.5 bar is the placard's own figure; the door label
# carries both, each rounded from 250 kPa independently.

groups:
  - orgId: 1
    name: Ioniq TPMS Alerts
    folder: Ioniq EV
    interval: 1m
    rules:
      - uid: ioniq-tpms-fl-psi-low
        title: "🚗 Ioniq Tyre Low — FL"
        condition: A
        data:
          - refId: q
            relativeTimeRange: { from: 604800, to: 0 }
            datasourceUid: P3C6603E967DC8568
            model:
              query: |
                SELECT last("value") FROM "ioniq"
                WHERE "group"='derived/tire_fl_bar_coldstart' AND time >= now() - 7d
              rawQuery: true
              resultFormat: time_series
          - refId: A
            datasourceUid: __expr__
            model:
              type: classic_conditions
              datasource: { type: __expr__, uid: __expr__ }
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              hide: false
              conditions:
                - evaluator: { type: lt, params: [2.20] }
                  operator: { type: and }
                  query: { params: [q] }
                  reducer: { type: last }
                  type: query
              expression: q
        noDataState: OK
        execErrState: OK
        for: 0s
        labels: { severity: warning, device: ioniq, subsystem: tpms }
        annotations:
          summary: "🚗 FL (front-left) tyre cold-start pressure below 2.20 bar"
          description: "Front-left tyre read under 2.20 bar on the first cold reading after an overnight park (placard 2.5 bar, defined at ambient). Inflate before the next drive; check for a slow leak."

      - uid: ioniq-tpms-fl-psi-crit
