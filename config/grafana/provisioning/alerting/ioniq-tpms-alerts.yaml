          - refId: A
            datasourceUid: __expr__
            model:
              type: classic_conditions
              datasource: { type: __expr__, uid: __expr__ }
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              hide: false
              conditions:
                - evaluator: { type: gt, params: [8] }
                  operator: { type: and }
                  query: { params: [q] }
                  reducer: { type: last }
                  type: query
              expression: q
        noDataState: OK
        execErrState: OK
        # A dragging brake or a failing bearing produces a sustained excess; a
        # transient step is a TPMS refresh artefact, not a fault (issue #1415).
        # Best-effort only -- see the note at the top of this file. It suppresses
        # an artefact that a corrective frame overwrites within 10 min (all three
        # historical cases), but not one that is the last value published before
        # the car sleeps.
        for: 10m
        labels: { severity: warning, device: ioniq, subsystem: tpms }
        annotations:
          summary: "🚗 FL (front-left) tyre running hot vs the other wheels"
          description: "front-left tyre is more than 8 °C hotter than the mean of the other three wheels. Check for a dragging brake, low pressure, or a failing bearing."

