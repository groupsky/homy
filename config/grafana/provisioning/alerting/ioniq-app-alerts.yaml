apiVersion: 1

# Thin rules for the alerts the car app computes itself (#1881).
#
# The app runs the real rules in the car and sends each alert to MQTT as
# `ioniq/parsed/alerts/<uid>`. mqtt-influx stores it in measurement `ioniq`,
# tag `group` = `alerts/<uid>`, with `firing` = 1 or 0. Each rule here only
# reads `firing`:
#   - for: 0s, because the app already waited the rule's duration.
#   - Evaluated every 5m, to keep the load on routy's InfluxDB low
#     (#1746). An alert reaches Grafana up to 5m late.
#   - A 30-day window and noDataState OK: the car sleeps most of the day, and
#     sleep must not resolve an alert. Only a `firing: 0` message resolves it.
#   - last("firing"): an alert that fired and resolved before Grafana saw it
#     firing (a short episode, or both messages sent late from the app's
#     outbox) reads 0 and sends nothing. It stays in Influx as history.
#
# One rule per rule in the other ioniq-*-alerts.yaml files, except
# ioniq-tpms-coldstart-stale (it reports missing data, not a car problem).
# The uid gets `-app`; labels, title and annotations are copied. A copied
# annotation that shows `$values.<x>` shows no value here (the query is not
# copied); at the switch the app's `summary` replaces it.
#
# Side-by-side run: the label side_by_side=true routes these to the silent
# receiver (notification-policies.yaml) while today's rules still send.
# Grafana wants unique titles in a folder, hence the separate folder.
# The test in .github/scripts/validate-grafana-alerts checks this file
# against today's rules.

groups:
  - orgId: 1
    name: Ioniq App Alerts
    folder: Ioniq EV (app)
    interval: 5m
    rules:
      - uid: ioniq-ldc-not-charging-app
        title: "🚗 Ioniq LDC Not Charging"
        condition: A
        data:
          - refId: firing
            relativeTimeRange: { from: 2592000, to: 0 }
            datasourceUid: P3C6603E967DC8568
            model:
              query: |
                SELECT last("firing") FROM "ioniq"
                WHERE "group"='alerts/ioniq-ldc-not-charging' AND time >= now() - 30d
              rawQuery: true
              resultFormat: time_series
          - refId: A
            datasourceUid: __expr__
            model:
              type: classic_conditions
              datasource: { type: __expr__, uid: __expr__ }
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              hide: false
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [firing] }
                  reducer: { type: last }
                  type: query
              expression: firing
        noDataState: OK
        execErrState: OK
        for: 0s
        labels: { severity: warning, device: ioniq, subsystem: 12v, side_by_side: "true" }
        annotations:
          summary: "🚗 12V LDC not charging"
          description: "The DC-DC converter (LDC) held the 12V rail below 13.2V for about 5 minutes while driving at low HV load. Suspect an LDC fault — the 12V battery is not being replenished. Investigate before it strands the car."
