apiVersion: 1

groups:
  - orgId: 1
    name: Ioniq Cell Health Alerts
    folder: Ioniq EV
    interval: 1m
    rules:
      - uid: ioniq-cell-spread-warning
        title: "🚗 Ioniq Cell Spread High (warning)"
        condition: A
        data:
          - refId: spread
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: P3C6603E967DC8568
            model:
              query: |
                SELECT last("value") FROM "ioniq"
                WHERE "group"='derived/cell_spread_mv' AND time >= now() - 30m
              rawQuery: true
              resultFormat: time_series
          - refId: A
            datasourceUid: __expr__
            model:
              type: classic_conditions
              datasource: { type: __expr__, uid: __expr__ }
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              hide: false
              conditions:
                - evaluator: { type: gt, params: [50] }
                  operator: { type: and }
                  query: { params: [spread] }
                  reducer: { type: last }
                  type: query
              expression: spread
        noDataState: OK
        execErrState: OK
        for: 10m
        labels: { severity: warning, device: ioniq, subsystem: battery }
        annotations:
          summary: "🚗 Cell voltage spread {{ $values.spread.Value }} mV at rest (> 50 mV)"
          description: "Rest cell-voltage spread is elevated (baseline ~20 mV). A widening spread points to a weakening cell; check the outlier cell index on the derived/cell_spread_mv series."

      - uid: ioniq-cell-spread-critical
        title: "🚗 Ioniq Cell Spread Critical"
        condition: A
        data:
          - refId: spread
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: P3C6603E967DC8568
            model:
              query: |
                SELECT last("value") FROM "ioniq"
                WHERE "group"='derived/cell_spread_mv' AND time >= now() - 30m
              rawQuery: true
              resultFormat: time_series
          - refId: A
            datasourceUid: __expr__
            model:
              type: classic_conditions
              datasource: { type: __expr__, uid: __expr__ }
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              hide: false
              conditions:
                - evaluator: { type: gt, params: [100] }
                  operator: { type: and }
                  query: { params: [spread] }
                  reducer: { type: last }
                  type: query
              expression: spread
        noDataState: OK
        execErrState: OK
        for: 10m
        labels: { severity: critical, device: ioniq, subsystem: battery }
        annotations:
          summary: "🚗 Cell voltage spread {{ $values.spread.Value }} mV at rest (> 100 mV)"
          description: "Rest cell-voltage spread is critically high. A cell is likely failing — inspect the outlier cell and have the pack serviced."

      # Retuned 2026-09-22 (threshold 8 -> 12 degC, last() -> min()), issue #1597.
      #
      # At 8 degC this fired on any long motorway drive. Air-cooled modules do
      # not all get the same airflow, so a steady load spreads their
      # temperatures out even with a healthy pack -- modules 2 and 11 always run
      # hottest, 5 and 8 always coldest, which is the normal airflow gradient,
      # not one module failing. Daily maximum spread over a month of normal use:
      # ordinary days 1-3 degC, 2026-09-03 6 degC, 2026-09-10 8 degC, 2026-09-14
      # (motorway) 10 degC, 2026-08-30 (motorway + two DC rapid charges) 11 degC.
      # 12 degC sits above all of these, so the rule now speaks about something
      # wider than anything seen in a month of driving plus fast charging.
      #
      # min() over the window rather than last(): see "last() Over a Long
      # Window Defeats for:" in config/grafana/CLAUDE.md. With last(), the
      # newest sample inside the 30m window keeps being returned on every
      # evaluation until a newer one arrives, so a single high sample from a
      # drive that has since ended can hold the rule firing for the whole
      # for: 10m window regardless of what the spread does afterwards. min()
      # on a gt threshold requires every sample in the window to exceed it,
      # so for: can actually filter a short-lived spike.
      - uid: ioniq-module-temp-spread-warning
        title: "🚗 Ioniq Module Temp Spread High (warning)"
        condition: A
        data:
          - refId: spread
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: P3C6603E967DC8568
            model:
              query: |
                SELECT min("value") FROM "ioniq"
                WHERE "group"='derived/module_temp_spread_c' AND time >= now() - 30m
              rawQuery: true
              resultFormat: time_series
          - refId: A
            datasourceUid: __expr__
            model:
              type: classic_conditions
              datasource: { type: __expr__, uid: __expr__ }
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              hide: false
              conditions:
                - evaluator: { type: gt, params: [12] }
                  operator: { type: and }
                  query: { params: [spread] }
                  reducer: { type: last }
                  type: query
              expression: spread
        noDataState: OK
        execErrState: OK
        for: 10m
        labels: { severity: warning, device: ioniq, subsystem: battery }
        annotations:
          summary: "🚗 Battery module temperature spread {{ $values.spread.Value }} °C (> 12 °C)"
          description: "Module temperatures are diverging. Baseline is about 2 °C at rest and up to about 10-11 °C on a long motorway drive or DC rapid charge, where uneven airflow spreads the modules out even on a healthy pack. Uneven cooling or a hot module — watch for a rising trend."

      # Retuned 2026-09-22 (last() -> min()), issue #1599. Same flaw #1598
      # fixed on the warning rule above: last() over the 30m window keeps
      # returning one high sample on every evaluation until a newer one
      # arrives, so a single spike can hold the rule firing for the whole
      # for: 10m and for: filters nothing. min() on a gt threshold requires
      # every sample in the window to exceed it, so for: can actually filter
      # a short-lived spike. See "last() Over a Long Window Defeats for:" in
      # config/grafana/CLAUDE.md.
      #
      # Threshold left at 15 degC: the highest daily spread seen in a month
      # of normal use, including a motorway drive and two DC rapid charges
      # (see the warning rule's comment above), is 11 degC. Warning is now
      # 12 degC, so 15 degC keeps critical a clear step above both the data
      # and the warning threshold.
      - uid: ioniq-module-temp-spread-critical
        title: "🚗 Ioniq Module Temp Spread Critical"
        condition: A
        data:
          - refId: spread
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: P3C6603E967DC8568
            model:
              query: |
                SELECT min("value") FROM "ioniq"
                WHERE "group"='derived/module_temp_spread_c' AND time >= now() - 30m
              rawQuery: true
              resultFormat: time_series
          - refId: A
            datasourceUid: __expr__
            model:
              type: classic_conditions
              datasource: { type: __expr__, uid: __expr__ }
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              hide: false
              conditions:
                - evaluator: { type: gt, params: [15] }
                  operator: { type: and }
                  query: { params: [spread] }
                  reducer: { type: last }
                  type: query
              expression: spread
        noDataState: OK
        execErrState: OK
        for: 10m
        labels: { severity: critical, device: ioniq, subsystem: battery }
        annotations:
          summary: "🚗 Battery module temperature spread {{ $values.spread.Value }} °C (> 15 °C)"
          description: "Module temperature spread is critically high. Risk of a thermal fault in one module — stop charging/driving and have the battery inspected."
