apiVersion: 1

groups:
  - orgId: 1
    name: Sunseeker Temperature Alerts
    folder: Lawn Mower
    interval: 5m
    rules:
      - uid: sunseeker-battery-temp-high
        title: Sunseeker Battery Temperature High
        condition: A
        data:
          - refId: temperature
            queryType: ''
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: P3C6603E967DC8568
            model:
              query: 'SELECT last("temperature") FROM "sunseeker_battery_detail" WHERE time >= now() - 30m'
              rawQuery: true
              resultFormat: time_series
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 45
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - temperature
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: temperature
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              type: classic_conditions
        # A dead ingestion pipeline is not a battery emergency. Both the NoData
        # and Error paths are silenced here so this rule can only speak about
        # data it can actually see; absence and query failure are owned by
        # sunseeker-telemetry-stale instead. See issue #1430 (int/float field
        # typing dropped every sunseeker_battery_detail point for days, and
        # these rules paged it as four battery/temperature alarms).
        noDataState: OK
        execErrState: OK
        for: 10m
        annotations:
          description: "Sunseeker battery temperature is dangerously high at {{ $values.temperature.Value }}°C (last reading, up to 30m old)"
          runbook_url: ""
          summary: "Battery temperature exceeds safe operating limits"
        labels:
          severity: warning
          device: sunseeker
          type: temperature
          
      - uid: sunseeker-battery-temp-low
        title: Sunseeker Battery Temperature Low
        condition: A
        data:
          - refId: temperature
            queryType: ''
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: P3C6603E967DC8568
            model:
              query: 'SELECT last("temperature") FROM "sunseeker_battery_detail" WHERE time >= now() - 30m'
              rawQuery: true
              resultFormat: time_series
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 5
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - temperature
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: temperature
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              type: classic_conditions
        # A dead ingestion pipeline is not a battery emergency. Both the NoData
        # and Error paths are silenced here so this rule can only speak about
        # data it can actually see; absence and query failure are owned by
        # sunseeker-telemetry-stale instead. See issue #1430 (int/float field
        # typing dropped every sunseeker_battery_detail point for days, and
        # these rules paged it as four battery/temperature alarms).
        noDataState: OK
        execErrState: OK
        for: 10m
        annotations:
          description: "Sunseeker battery temperature is critically low at {{ $values.temperature.Value }}°C (last reading, up to 30m old)"
          runbook_url: ""
          summary: "Battery temperature below safe operating limits"
        labels:
          severity: warning
          device: sunseeker
          type: temperature