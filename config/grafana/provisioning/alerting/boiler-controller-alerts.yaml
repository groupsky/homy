apiVersion: 1

groups:
  - orgId: 1
    name: Boiler Controller Alerts
    folder: Automation Alerting
    interval: 1m
    rules:
      - uid: boiler-controller-overheating
        title: Boiler Overheating Critical
        condition: A
        data:
          - refId: temperature
            queryType: ''
            relativeTimeRange:
              from: 300  # 5 minutes lookback
              to: 0
            datasourceUid: P3C6603E967DC8568
            model:
              query: 'SELECT last("t2") FROM "xymd1" WHERE "device.name"=''solar_heater'' AND time >= now() - 5m'
              rawQuery: true
              resultFormat: time_series
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 85
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - temperature
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: temperature
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              type: classic_conditions
        noDataState: NoData
        execErrState: Alerting
        for: 2m
        annotations:
          summary: "🔥 Boiler Temperature Critical"
          description: "Boiler top temperature is above 85°C for more than 2 minutes. This may indicate safety system failure or excessive heating demand."
        labels:
          severity: critical
          system: boiler
          component: temperature

      # --- Emergency heating: why gt 0 / noDataState OK / 20m window / for 30m ---
      #
      # This rule shipped with `type: gte`, which Grafana 9.5 classic_conditions
      # does not accept (only gt, lt, within_range, outside_range, no_value). It
      # failed to build an evaluator on every tick and, with execErrState OK, was
      # reported Normal - silently dead since it was written. See issue #1475.
      # `gte 1` on a count is `gt 0`. CI now parses every rule in this directory
      # and rejects any unsupported evaluator
      # (.github/workflows/validate-grafana-alerts.yml) - though that check is
      # NOT yet a required status check on master, so it reports without blocking.
      #
      # WHAT "EMERGENCY" MEANS HERE. `emergency_heating_*` is raised whenever the
      # tank top or bottom is below `emergencyMin`, which is 30 degC in the
      # DEPLOYED config (config/automations/boiler-controller-config.js:19). The
      # bot's own default is 45 (boiler-controller.js:14) and is NOT what runs -
      # always quote the deployed value, never the default. The data agrees:
      # across 1385 emergency points from 2025-09-27 to 2026-08-07,
      # `temp_bottom_seen` ran 15.3..29.9 degC and `temp_top_seen` at top_cold ran
      # 21.8..29.9. Nothing near 45. 93.7% of points are bottom_cold (1298),
      # 6.3% top_cold (87).
      #
      #   * `count("heaterState")`, NOT `count(*)` - but NOT for the reason it
      #     looks like. A multi-series frame does NOT produce one alert instance
      #     per series: `ConditionsCmd.Execute` (v9.5.21 pkg/expr/classic/
      #     classic.go) builds exactly one unlabelled `mathexp.NewNumber("", nil)`
      #     and OR-folds the series inside `executeCond`, leaving the per-series
      #     outcomes as EvalMatch metadata only. One instance either way. The real
      #     reasons: `count(*)`'s column set is UNSTABLE - 7 columns over 30 days,
      #     9 over 330 days on this measurement - so the query changes shape with
      #     its own time window; and it drags in the legacy `controlMode`/`reason`
      #     string fields (distinct from the same-named tags) plus
      #     `manualOverrideExpires`, which SHOW FIELD KEYS reports with CONFLICTING
      #     TYPES, integer AND string. With OR-folding, any of those can decide the
      #     condition. `heaterState` is on 100% of points (4851/4851 over the 30
      #     days to 2026-08-09) and means exactly "the controller published".
      #
      #   * noDataState is OK, and this is load-bearing. InfluxQL `count()` over a
      #     range with no matching rows returns NO ROWS, not 0 - not even with
      #     `GROUP BY time() fill(0)` (verified against production: a 20 min window
      #     ending 2026-08-08T12:00:00Z returned nothing at all). Emergency heating
      #     is absent ~96% of the time, so this single-condition rule spends almost
      #     all of its life in NoData. The shipped `noDataState: NoData` would
      #     therefore have raised a permanent DatasourceNoData notification the
      #     moment the evaluator started building - a pager storm, not an alert.
      #     "No rows" here means "no emergency", which is the healthy state: OK.
      #
      #   * The 20 min lookback is tied to the controller's 15 min heartbeat.
      #     boiler-controller.js publishes automation_status only when the decision
      #     or reason CHANGES, plus a heartbeat every 15 min that repeats
      #     lastDecisionReason. A window shorter than 15 min usually cannot bridge
      #     two consecutive heartbeats, so one real emergency episode is torn into
      #     fragments and the rule fires on sub-minute alignment luck rather than on
      #     duration. 20 min is the smallest window that exceeds the heartbeat. It
      #     bridges 888 of the 928 intra-episode gaps (95.7%); 40 gaps still exceed
      #     20 min, so "usually", not "always". IT IS TIED TO THAT HEARTBEAT: if the
      #     15 min interval in docker/automations/bots/boiler-controller.js changes,
      #     re-tune this.
      #
      #   * `for: 30m` with a 20 min window means the condition must hold for 30 min,
      #     and an episode of span S holds it for S + 20 min, so firing requires
      #     S >= ~11 min - i.e. the "more than 10 minutes" this is meant to detect,
      #     now actually measured rather than approximated by alignment.
      #
      # VERIFIED BY REPLAY against production InfluxDB over the FULL dataset -
      # 2025-09-27..2026-08-07, 314 days, 1385 emergency points - at 1-minute
      # evaluations on one shared grid. Episodes are gap-clustered at 16 min; the
      # clustering must exceed the 15 min heartbeat or the metric collapses (at
      # 10 min only 10 episodes look "long"), and it is stable for any threshold
      # above it (288 long episodes at 16m, 288 at 20m, 290 at 30m). 503 episodes,
      # 288 of span >= 10 min.
      #
      #                       shipped 10m/10m      this rule 20m/30m
      #     firings                       344                    280
      #     long episodes caught      166/288                276/288
      #     false pages                   138                      4
      #     duplicate pages                40                      0
      #     time-to-page p50/p95    10.6/55.6 min        30.5/30.9 min
      #
      #   The old shape missed 122 of the 288 sustained episodes outright and paged
      #   138 times for episodes shorter than the 10 min it claimed to detect.
      #   Known miss for the new shape: 2026-07-01T19:22:18Z, span 10.5 min, sits
      #   right on the threshold and does not fire - 1 expected in Jul, 0 delivered.
      #
      #   * severity is `warning`, PROVISIONALLY. At 26.7 pages/30d annualised and
      #     40-44 per month through Dec-Feb this is more than one page a day for a
      #     third of the year, and 93.7% of it is the tank BOTTOM below 30 degC,
      #     which on a stratified tank with a cold mains inlet is what happens after
      #     any winter hot-water draw. Whether that is the automation working as
      #     intended or a real problem is issue #1477; revisit this label there.
      #     Do NOT retune `emergencyMin` to quiet this alert - that changes when the
      #     immersion heater runs, which is the automation's semantics, not ours.
      #
      #   * Why a reason-based rule rather than a temperature one. The alternative
      #     is `max("t1") FROM "xymd1" ... lt 30` with `for: 0` on a probe logging
      #     ~2777 points/hour: a true duration test, no stale tail, and no
      #     dependence on the bot's publish cadence. It was considered and not
      #     taken, because matching on `reason` inherits the bot's own suppression -
      #     during `manual_off` and `vacation_*` the bot never emits an emergency
      #     reason, so a deliberately cold tank stays quiet, whereas a temperature
      #     rule would need its own `controlMode` gate. That is the trade: this
      #     shape is a choice, not the only option.
      #
      #   * execErrState stays OK. boiler-controller-not-responding below already
      #     owns "automation_status cannot be read" with execErrState Alerting;
      #     duplicating it here would double-page one datasource fault. But be
      #     honest about the cost: OK/OK makes this rule UNFALSIFIABLE - it reads
      #     Normal when there is no emergency AND when it is completely broken
      #     (datasource down, measurement or field renamed, typo'd refId, or the bot
      #     changing the reason strings so /.*emergency.*/ stops matching). The CI
      #     evaluator check closes exactly one syntactic member of that class. Only
      #     an external check on Grafana's error log or
      #     grafana_alerting_rule_evaluation_failures_total proves it is alive.
      #     See config/grafana/CLAUDE.md, "Staleness / Absence Alerts".
      - uid: boiler-controller-emergency-heating
        title: Boiler Emergency Heating Active
        condition: A
        data:
          - refId: reason
            queryType: ''
            relativeTimeRange:
              from: 1200  # 20 minutes lookback - must exceed the 15m heartbeat
              to: 0
            datasourceUid: P3C6603E967DC8568
            model:
              query: 'SELECT count("heaterState") FROM automation_status WHERE "service"=''boilerController'' AND reason =~ /.*emergency.*/ AND time >= now() - 20m'
              rawQuery: true
              resultFormat: time_series
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: classic_conditions
              conditions:
                - evaluator:
                    params: [0]  # gt 0 == the unsupported `gte 1` this rule shipped with
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [reason]
                  reducer:
                    type: last
                  type: query
              expression: reason
        noDataState: OK  # no rows == no emergency == healthy; see the note above
        execErrState: OK
        for: 30m
        annotations:
          summary: "❄️ Boiler Emergency Heating Active"
          description: >-
            The boiler controller reported emergency heating (tank top or bottom below 30°C,
            `emergencyMin` in config/automations/boiler-controller-config.js) continuously for
            more than 10 minutes. This fires 30 minutes after the emergency began, and the
            condition lags the tank by up to 20 minutes, so the boiler may already have
            recovered by the time you read this. Almost all of these are the tank bottom
            after a large hot-water draw - see issue #1477 before treating it as a fault.
        labels:
          # Provisional - see issue #1477 and the note above.
          severity: warning
          system: boiler
          component: automation

      # Absence rule: it WANTS to fire when the data stops, so noDataState stays
      # Alerting - and that is the only path by which it can fire. InfluxQL
      # `count()` over a range with no matching rows returns no rows at all, so
      # `lt 1` is unreachable and is kept only as a defensive floor.
      #
      # `count(*)` was replaced by `count("heaterState")` for the same reasons as
      # boiler-controller-emergency-heating above: the `count(*)` column set is
      # unstable across time ranges and pulls in the legacy `controlMode`/`reason`
      # string fields and the conflicting-type `manualOverrideExpires`.
      # NOT because a sparse field could page a false "controller offline" - it
      # could not. A field with no points in the range comes back as a column that
      # is PRESENT WITH NULL VALUES (measured: `controlMode` and `reason` over 330
      # days), neither omitted nor 0, and `last` over an all-null series returns a
      # Number with a nil value (pkg/expr/classic/reduce.go), which the evaluator
      # treats as not-firing. `heaterState` is on 100% of points (4851/4851 over
      # the 30 days to 2026-08-09), so it is the honest single-series proxy for
      # "the controller published something".
      - uid: boiler-controller-not-responding
        title: Boiler Controller Not Responding
        condition: A
        data:
          - refId: decisions
            queryType: ''
            relativeTimeRange:
              from: 1800  # 30 minutes lookback
              to: 0
            datasourceUid: P3C6603E967DC8568
            model:
              query: 'SELECT count("heaterState") FROM automation_status WHERE "service"=''boilerController'' AND time >= now() - 30m'
              rawQuery: true
              resultFormat: time_series
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: classic_conditions
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [decisions]
                  reducer:
                    type: last
                  type: query
              expression: decisions
        noDataState: Alerting
        execErrState: Alerting
        for: 30m
        annotations:
          summary: "🚨 Boiler Controller Offline"
          description: "No status updates received from boiler controller in the last 30 minutes. The automation system may be down or disconnected. Controller sends heartbeat every 15 minutes."
        labels:
          severity: critical
          system: boiler
          component: automation


      - uid: boiler-temperature-sensor-failure
        title: Boiler Temperature Sensor Failure
        condition: A
        data:
          - refId: temp_readings
            queryType: ''
            relativeTimeRange:
              from: 1800  # 30 minutes lookback
              to: 0
            datasourceUid: P3C6603E967DC8568
            model:
              query: 'SELECT count("t2") FROM "xymd1" WHERE "device.name"=''solar_heater'' AND time >= now() - 30m'
              rawQuery: true
              resultFormat: time_series
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: classic_conditions
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [temp_readings]
                  reducer:
                    type: last
                  type: query
              expression: temp_readings
        noDataState: NoData
        execErrState: Alerting
        for: 30m
        annotations:
          summary: "🌡️ Boiler Temperature Sensor Offline"
          description: "No temperature readings from boiler sensors in the last 30 minutes. Temperature monitoring is unavailable."
        labels:
          severity: high
          system: boiler
          component: sensors

      - uid: boiler-excessive-power-consumption
        title: Boiler Excessive Power Consumption
        condition: A
        data:
          - refId: power
            queryType: ''
            relativeTimeRange:
              from: 900  # 15 minutes lookback
              to: 0
            datasourceUid: P3C6603E967DC8568
            model:
              query: 'SELECT mean("p") FROM "raw" WHERE "device.name"=''boiler'' AND time >= now() - 15m'
              rawQuery: true
              resultFormat: time_series
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: classic_conditions
              conditions:
                - evaluator:
                    params: [3000]  # 3kW sustained consumption
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [power]
                  reducer:
                    type: avg
                  type: query
              expression: power
        noDataState: NoData
        execErrState: OK
        for: 15m
        annotations:
          summary: "⚡ Boiler High Power Consumption"
          description: "Boiler power consumption above 3kW for more than 15 minutes. Check for efficiency issues or excessive heating demand."
        labels:
          severity: warning
          system: boiler
          component: energy


      # --- Solar circuit: why `outputs.p1` state changes cannot be alerted on ---
      #
      # The SR-04 solar controller runs a `kick` anti-seize function: a short pump
      # pulse every ~15-27 minutes through its daylight window (`kickOn: 8`,
      # `kickOff: 20`; the device's own `kickPause` register reads 30 and
      # `kickTime` 3). `outputs.p1` therefore takes BOTH values in every daylight
      # hour whether or not any heat is being moved, and takes only ONE value all
      # night when the pump is correctly idle. Any rule shaped like
      # `count(DISTINCT "outputs.p1") <= 1` is exactly inverted with respect to the
      # failure it is meant to catch. The previous version of this rule was:
      #
      #   SELECT count(DISTINCT "outputs.p1") FROM "xymd1"
      #   WHERE "device.name"='solar_heater' AND time >= now() - 1h    -- lte 1, for 1h
      #
      # Replayed over 2026-04-25..2026-08-09 it fired on ~45% of all hours - every
      # night on all 107 days - and for ZERO daylight hours during the 63-day solar
      # outage of 2026-06-08..2026-08-09, when the collector probe failed and the
      # circuit delivered no heat at all. See issue #1472.
      #
      # What replaces it, and why these numbers:
      #
      #   * Pump activity is measured as a SAMPLE COUNT of `outputs.p1 = true`, not
      #     as state changes. The solar Modbus bus polls every ~1.28 s (2810-2814
      #     samples/hour), so 6 hours holds ~16900 samples. Kick alone contributes
      #     3-9 samples/hour, i.e. ~38-48 per 6 h window. `lt 100` sits at roughly
      #     2x pure kick. It IS tied to the poll rate: if the solar bus gains
      #     devices or slows down, re-measure and retune.
      #   * PV output gates "the sun is actually out", using an independent sensor
      #     (the SUN2000 inverter) rather than the collector probe `t3`, which is
      #     the very thing that failed silently in #1472.
      #   * `max(t2) < 55` suppresses the legitimate case "the tank is already hot,
      #     so the controller has correctly stopped circulating". The electric
      #     heater cuts out at 50 degC (`comfortMin: 47` + `hysteresis: 3` in
      #     config/automations/boiler-controller-config.js), so a top temperature
      #     below 55 means nothing but electricity has heated this tank.
      #
      # IMPORTANT - why the PV query is `GROUP BY time(1h)` with `reducer: avg` and
      # not a bare `mean("ap")`: InfluxQL `mean()` averages over POINTS, not over
      # time. The inverter publishes on change (`maxMsBetweenReports` 5 min), so it
      # logs ~60-77 points/hour in daylight against ~11/hour at night, and a bare
      # `mean()` over a 12 h window is biased high by 30-40%. Bucketing to hourly
      # means first and averaging those gives a true time-weighted kW, so
      # `threshold x window hours` really is kWh. Measured on 2026-01-12: bare
      # `mean("ap")` = 1.286 kW (implying 15.4 kWh) against 12.72 kWh actually
      # generated; the bucketed form gives 0.75 kW = 9.0 kWh. Getting this wrong
      # made an earlier draft of `boiler-solar-no-contribution` fire on ordinary
      # winter days.
      #
      # Verified by replay against production InfluxDB, hourly evaluation, over the
      # full two years 2024-08-01..2026-08-09:
      #   0 alert days outside the outage - none in either winter
      #   50 of the 63 outage days, first alert on 2026-06-08 - day one of the
      #     failure - in the window ending 09:00Z (pump_on=38, solar_kw=1.62,
      #     tank_top=48.9)
      #   Fires only between 10:00Z and 17:00Z; never at night.
      # The 13 outage days it misses are days when kick alone happened to exceed
      # the threshold (across 89 outage windows the pump-on count runs 8..814,
      # median 38) or PV was too low; `boiler-solar-no-contribution` covers most of
      # them.
      #
      # noDataState is OK. Note the mechanism is NOT "the rule goes NoData at
      # night": Grafana's classic_conditions combines the per-condition NoData flag
      # with the SAME operator as the firing flag (v9.5 pkg/expr/classic), so with
      # `solar_kw` and `tank_top` always returning rows the ANDed NoData collapses
      # to false. What actually happens is that an empty `pump_on` result makes
      # that condition evaluate FALSE, so the rule reports OK. Same outcome, and
      # the same blind spot either way: a pump wedged fully off - kick included -
      # produces no rows and cannot be caught here. That case is covered by
      # `boiler-solar-no-contribution` below, which never reads `outputs.p1`.
      #
      # Both solar rules fire on most of the same days during a real fault, in
      # overlapping hours, under different alertnames - so a sustained outage pages
      # roughly twice as often as one rule alone. That is accepted, for the same
      # reason as the sunseeker connectivity/staleness pair: neither rule can see
      # the other's failure mode. See config/grafana/CLAUDE.md.
      - uid: boiler-solar-circulation-stuck
        title: Solar Circulation Idle While Sunny
        condition: A
        data:
          - refId: pump_on
            queryType: ''
            relativeTimeRange:
              from: 21600  # 6 hour lookback
              to: 0
            datasourceUid: P3C6603E967DC8568
            model:
              query: 'SELECT count("outputs.p1") FROM "xymd1" WHERE "device.name"=''solar_heater'' AND "outputs.p1"=true AND time >= now() - 6h'
              rawQuery: true
              resultFormat: time_series
          - refId: solar_kw
            queryType: ''
            relativeTimeRange:
              from: 21600  # 6 hour lookback
              to: 0
            datasourceUid: P3C6603E967DC8568
            model:
              query: 'SELECT mean("ap") FROM "inverter" WHERE "device.name"=''main'' AND time >= now() - 6h GROUP BY time(1h) fill(0)'
              rawQuery: true
              resultFormat: time_series
          - refId: tank_top
            queryType: ''
            relativeTimeRange:
              from: 21600  # 6 hour lookback
              to: 0
            datasourceUid: P3C6603E967DC8568
            model:
              query: 'SELECT max("t2") FROM "xymd1" WHERE "device.name"=''solar_heater'' AND time >= now() - 6h'
              rawQuery: true
              resultFormat: time_series
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: classic_conditions
              datasource:
                type: __expr__
                uid: __expr__
              refId: A
              conditions:
                - evaluator:
                    params: [100]  # ~2x the ~38-48 samples pure kick leaves in 6h
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [pump_on]
                  reducer:
                    type: last
                  type: query
                - evaluator:
                    params: [1.5]  # time-weighted kW over 6h => ~9 kWh harvested: clearly sunny
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [solar_kw]
                  reducer:
                    type: avg  # average the hourly buckets -> time-weighted, see comment above
                  type: query
                - evaluator:
                    params: [55]  # electric cutoff is 50 degC; above 55 means solar did work
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [tank_top]
                  reducer:
                    type: last
                  type: query
              expression: pump_on
        noDataState: OK
        execErrState: OK
        for: 1h
        annotations:
          summary: "☀️ Solar Circulation Idle While Sunny"
          description: "The solar pump has run for under ~2 minutes in the last 6 hours while the PV inverter averaged over 1.5 kW and the boiler top stayed below 55°C. Only the SR-04 anti-seize kick is moving the pump. Check the collector probe (t3) against the actual collector temperature, then the pump and the SR-04 delta settings."
        labels:
          severity: warning
          system: boiler
          component: solar

      # --- No solar contribution on a sunny day ---
      #
      # The strongest available signal, and independent of `outputs.p1` entirely:
      # on a day with real PV yield, a boiler top that never rises above the
      # electric cutoff proves 100% of the heat was electric.
      #
      #   * 50.0 degC is the electric cutoff (`comfortMin: 47` + `hysteresis: 3`).
      #     Through the 2026-06-08..2026-08-09 outage `max(t2)` was exactly 50.0 on
      #     51 of the 63 days and never above 50.9 except on the 2026-08-09 repair
      #     day; before it, good days reached 61-71 degC. `lt 50.5` allows half a
      #     degree of overshoot and measurement noise.
      #   * `solar_kw > 1.3` is a TIME-WEIGHTED kW over 12 h (see the long note on
      #     the rule above for why the hourly bucketing is load-bearing), so it
      #     means ~15.6 kWh actually landed inside the window. A full solar day
      #     here is 20-26 kWh, so this can only be satisfied by a window covering
      #     most of one sunny day - which is what makes a 12 h rolling window
      #     behave like a daily check without needing a fixed evaluation time. A
      #     24 h window was tried first and rejected: it straddles two days, so one
      #     dull day plus the next sunny morning fired it.
      #   * NOT dormant in winter, and it must not be assumed to be. An earlier
      #     draft used a bare `mean("ap")` and fired on ordinary December-February
      #     days; with the time-weighted form the winter firings drop away, but
      #     2026-02-25 still alerts and is a genuine no-contribution day.
      #
      # Verified by replay against production InfluxDB, hourly evaluation, over the
      # full two years 2024-08-01..2026-08-09:
      #   4 alert days outside the outage - 2025-05-28, 2026-02-25, 2026-04-08 and
      #     2026-05-13. All four are true positives by this rule's own definition:
      #     PV yield 18.1-24.2 kWh, collector peaking at 49.2-51.8 degC against a
      #     tank held at 50.0-50.4, i.e. the solar circuit really did contribute
      #     nothing. Expect roughly two such alerts a year.
      #   56 of the 63 outage days, first alert on 2026-06-08 - day one - in the
      #     window ending 11:00Z (solar_kw=1.38, tank_top=49.8). Fires 12:00Z-21:00Z.
      # Together with boiler-solar-circulation-stuck, 59 of the 63 outage days
      # raised an alert. The four that did not: 2026-06-12 and 2026-07-02 (too
      # little sun to pass the gate), 2026-07-23 (a 7.8 h data outage - note the
      # bare `mean("ap")` reads 1.66 kW there against 0.42 time-weighted, which is
      # the point-weighting bias in miniature) and 2026-08-09 (the repair day).
