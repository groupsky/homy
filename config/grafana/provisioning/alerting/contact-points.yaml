apiVersion: 1

contactPoints:
  - orgId: 1
    name: telegram-webhook
    receivers:
      - uid: telegram-webhook
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://telegram-bridge:3000/webhook
          httpMethod: POST
          maxAlerts: 0
          title: "Home Automation Alert"
  # Same webhook, without RESOLVED messages. For "done" reminders, where the
  # alert resolving later says nothing new (#1668). Routed by the label
  # notify_resolved=false (notification-policies.yaml).
  - orgId: 1
    name: telegram-webhook-no-resolve
    receivers:
      - uid: telegram-webhook-no-resolve
        type: webhook
        disableResolveMessage: true
        settings:
          url: http://telegram-bridge:3000/webhook
          httpMethod: POST
          maxAlerts: 0
          title: "Home Automation Alert"
  # Sends nothing. The side-by-side run of the car app's alerts (#1881) goes
  # here: the route is muted all the time (mute timing `always` in
  # notification-policies.yaml), and the URL goes nowhere in case the mute is
  # ever lost.
  - orgId: 1
    name: silent
    receivers:
      - uid: silent
        type: webhook
        disableResolveMessage: true
        settings:
          url: http://127.0.0.1:9/silent
          httpMethod: POST
