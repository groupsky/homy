# This is a Mosquitto configuration file that creates a listener on port 1883
# that allows unauthenticated access.
# Reference: https://mosquitto.org/man/mosquitto-conf-5.html

listener 1883
allow_anonymous true

persistence true
# Bind-mounted at ${DATA_PATH}/mosquitto/data (docker-compose.yml); never an
# unnamed Docker volume, so `docker compose down` keeps retained messages.
persistence_location /mosquitto/data/
