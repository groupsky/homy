# Mosquitto configuration for the broker on routy.
# Reference: https://mosquitto.org/man/mosquitto-conf-5.html
#
# Three listeners, each with its own settings:
#   1883: anonymous, for the docker networks. docker-compose.yml publishes it
#         on routy's 127.0.0.1 only, so it is not open to the outside (#1964).
#   1884: login only, for the car app. Its rights are in car.acl (#1962).
#   1885: login only, for the server clients outside docker. Their rights are
#         in servers.acl (#1964).
# The clients, their users and how to add them: docs/mqtt-car-user.md.

per_listener_settings true

listener 1883
allow_anonymous true

listener 1884
allow_anonymous false
# docker/mosquitto/entrypoint.sh copies the deployed password file here, or
# makes an empty one (nobody can log in) when the deploy has none.
password_file /mosquitto/auth/passwd
acl_file /mosquitto/config/car.acl
# Client ids are shared by all listeners. This stops a 1884 user from taking
# the id of a 1883 client and pushing it off the broker.
use_username_as_clientid true

listener 1885
allow_anonymous false
# Its own password file: the car's password does not work here.
password_file /mosquitto/auth/servers.passwd
acl_file /mosquitto/config/servers.acl
# No use_username_as_clientid here: the fleet checkers share one user and
# run at the same time, each with its own client id. These users are on
# servers we manage, not on a device that keeps its password in plain text.

persistence true
# Bind-mounted at ${DATA_PATH}/mosquitto/data (docker-compose.yml); never an
# unnamed Docker volume, so `docker compose down` keeps retained messages.
persistence_location /mosquitto/data/
