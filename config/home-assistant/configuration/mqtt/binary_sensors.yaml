- name: Dishwasher
  state_topic: "/modbus/secondary/dishwasher/reading"
  value_template: "{{ 'ON' if value_json.p|float(default=0) > 10 else 'OFF' }}"

- name: Laundry
  state_topic: "/modbus/secondary/laundry/reading"
  value_template: "{{ 'ON' if value_json.p|float(default=0) > 1 else 'OFF' }}"

- name: Oven
  state_topic: "/modbus/secondary/oven/reading"
  value_template: "{{ 'ON' if value_json.p|float(default=0) > 1 else 'OFF' }}"

- name: Stove
  state_topic: "/modbus/secondary/stove/reading"
  value_template: "{{ 'ON' if value_json.p|float(default=0) > 10 else 'OFF' }}"

# The Ioniq has a fault code (#1800). Retained logger topics; the codes are in
# the attributes. Stored codes stay until cleared; pending ones may not repeat.
# A failed read (NO DATA, error reply) has no `codes` field. It must not turn
# the flag OFF (#1866): the state template renders '' (ignored) and the
# attributes template renders the current attributes again.
- name: ioniq_fault_stored
  state_topic: "ioniq/parsed/dtc/stored"
  value_template: &ioniq_fault_state "{{ ('ON' if value_json.codes | length > 0 else 'OFF') if value_json.codes is defined else '' }}"
  json_attributes_topic: "ioniq/parsed/dtc/stored"
  json_attributes_template: &ioniq_fault_attrs >-
    {{ ({'codes': value_json.codes, 'ts': value_json.ts} if value_json.codes is defined
    else {'codes': this.attributes.codes, 'ts': this.attributes.ts | default(none)} if this.attributes.codes is defined
    else {}) | tojson }}
  device_class: problem

- name: ioniq_fault_pending
  state_topic: "ioniq/parsed/dtc/pending"
  value_template: *ioniq_fault_state
  json_attributes_topic: "ioniq/parsed/dtc/pending"
  json_attributes_template: *ioniq_fault_attrs
  device_class: problem

# The kitchen oven (#1907), from the hcpy bridge. Only the bridge's LWT
# topics decide availability (see selects.yaml for why).
# ON while someone uses the oven from its panel or door: hcpy's own
# controls are `unavailable` then.
- name: oven_local_control
  state_topic: "homeconnect/oven/state/bsh_common_status_localcontrolactive"
  payload_on: "True"
  payload_off: "False"
  availability_mode: all
  availability: &oven_availability
    - topic: "homeconnect/LWT"
    - topic: "homeconnect/oven/LWT"

- name: oven_remote_start_allowed
  state_topic: "homeconnect/oven/state/bsh_common_status_remotecontrolstartallowed"
  payload_on: "True"
  payload_off: "False"
  availability_mode: all
  availability: *oven_availability

# Events: `Present` while the oven shows it, then `Confirmed` or `Off`.
- name: oven_preheat_finished
  state_topic: "homeconnect/oven/event/cooking_oven_event_cavity_001_regularpreheatfinished"
  value_template: &oven_event "{{ 'ON' if value_json.event_type == 'Present' else 'OFF' }}"
  availability_mode: all
  availability: *oven_availability

- name: oven_fast_preheat_finished
  state_topic: "homeconnect/oven/event/cooking_oven_event_cavity_001_fastpreheatfinished"
  value_template: *oven_event
  availability_mode: all
  availability: *oven_availability

- name: oven_program_finished
  state_topic: "homeconnect/oven/event/cooking_oven_event_cavity_001_programfinished"
  value_template: *oven_event
  availability_mode: all
  availability: *oven_availability

- name: oven_program_aborted
  state_topic: "homeconnect/oven/event/cooking_oven_event_cavity_001_programaborted"
  value_template: *oven_event
  availability_mode: all
  availability: *oven_availability
