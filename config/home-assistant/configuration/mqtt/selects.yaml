    {% set m = {'Пиролиза': 'Cleaning.Pyrolysis', 'Говежди рула от месо': 'Dish.Automatic.Conv.BeefRoulade', 'Агнешко бутче, средно изпечено': 'Dish.Automatic.Conv.BonelessLegOfLambMedium', 'Агнешки бут, добре опечен': 'Dish.Automatic.Conv.BonelessLegOfLambWellDone', 'Бут от сърна': 'Dish.Automatic.Conv.BonelessLegOfVenison', 'Свински печен врат': 'Dish.Automatic.Conv.BonelessPorkNeckJoint', 'Части пиле': 'Dish.Automatic.Conv.ChickenParts', 'Пица, дебел блат': 'Dish.Automatic.Conv.FrozenDeepPanPizza', 'Лазаня': 'Dish.Automatic.Conv.FrozenLasagne', 'Пица, тънък блат': 'Dish.Automatic.Conv.FrozenThinCrustPizza', 'Гулаш': 'Dish.Automatic.Conv.Goulash', 'Свинско печено, с коричка': 'Dish.Automatic.Conv.JointOfPorkWithCrackling', 'Телешко печено, постно': 'Dish.Automatic.Conv.JointOfVealLean', 'Телешко печено, прошарено': 'Dish.Automatic.Conv.JointOfVealMarbled', 'Руло от кайма, прясно': 'Dish.Automatic.Conv.MeatLoafMadeFromFreshMincedMeat', 'Печени хлебчета': 'Dish.Automatic.Conv.PartCookedBreadRollsOrBaguette', 'Пудинг с юфка': 'Dish.Automatic.Conv.PastaBake', 'Пържени картофи': 'Dish.Automatic.Conv.PommesFrites', 'PorkNeckJoint': 'Dish.Automatic.Conv.PorkNeckJoint', 'Говежд. задуш. на фурна': 'Dish.Automatic.Conv.PotRoastedBeef', 'Огретен с картофи': 'Dish.Automatic.Conv.PotatoGratin', 'Ростбиф, средно изпечен': 'Dish.Automatic.Conv.SirloinMedium', 'Яхния, с месо': 'Dish.Automatic.Conv.StewWithMeat', 'Яхния, със зеленчуци': 'Dish.Automatic.Conv.StewWithVegetables', 'Пуешки гърди': 'Dish.Automatic.Conv.TurkeyBreast', 'Пиле, непълнено': 'Dish.Automatic.Conv.UnstuffedChicken', 'Патица, непълнена': 'Dish.Automatic.Conv.UnstuffedDuck', 'Гъска, непълнена': 'Dish.Automatic.Conv.UnstuffedGoose', 'Печени картофи на фурна, цели': 'Dish.Automatic.Conv.WholeBakedPotatoes', 'Риба, цяла': 'Dish.Automatic.Conv.WholeFish', 'Питомен заек, цял': 'Dish.Automatic.Conv.WholeRabbit', 'Допълнително готвене': 'Dish.SubsequentCooking', '3D горещ въздух': 'HeatingMode.3DHotAir', 'Air Fry': 'HeatingMode.AirFry', 'BottomHeating': 'HeatingMode.BottomHeating', 'Размразяване': 'HeatingMode.Defrost', 'Грил, гол. повърх.': 'HeatingMode.GrillLargeArea', 'Мек горещ въздух': 'HeatingMode.HotAirGentle', 'Вентилаторно печене на грил': 'HeatingMode.HotAirGrilling', 'LetRest': 'HeatingMode.LetRest', 'Степен за пица': 'HeatingMode.PizzaSetting', 'PreHeating': 'HeatingMode.PreHeating', 'Поддържане топло за по-дълъг период': 'HeatingMode.SabbathProgramme', 'Печ. слабо': 'HeatingMode.SlowCook', 'Горно/долно нагряване': 'HeatingMode.TopBottomHeating'} %}[{"program":"Cooking.Oven.Program.{{ m[value] }}","options":[]}]
