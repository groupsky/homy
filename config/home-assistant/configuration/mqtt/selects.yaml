# Selecting here starts the program on the oven.
- name: oven_active_program
  state_topic: "homeconnect/oven/state/bsh_common_root_activeprogram"
  command_topic: "homeconnect/oven/activeProgram"
  retain: false
  availability_mode: all
  availability: *oven_availability
  value_template: *oven_program_bg
  command_template: *oven_program_cmd
  options: *oven_program_options
