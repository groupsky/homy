# The oven's programs in Bulgarian (#1907). hcpy's own selects
# (select.oven_bsh_common_root_*) go `unavailable` whenever the oven is used
# from its panel: hcpy adds `bsh_common_status_localcontrolactive` as an
# availability topic. These depend only on the bridge's LWT topics, so they
# keep their state; binary_sensor.oven_local_control shows the lock instead.
#
# hcpy publishes the last part of the program key (`3DHotAir`) or `None`.
# The Bulgarian names and descriptions are copied from Bosch's Bulgarian
# manual for this oven (document 9001919872, bg-BG, HBG578EB7); see
# docs/oven.md. A key with no name in the manual stays as the raw key.
#
# The command sends the full program key: hcpy finds the program by a
# substring match, so the short `PorkNeckJoint` could pick
# `BonelessPorkNeckJoint`. Never retained: hcpy would get it again at every
# restart. Tests: docker/modbus-serial/integrations/ha-oven-templates.test.js
- name: oven_selected_program
  state_topic: "homeconnect/oven/state/bsh_common_root_selectedprogram"
  command_topic: "homeconnect/oven/selectedProgram"
  retain: false
  availability_mode: all
  availability: &oven_availability
    - topic: "homeconnect/LWT"
    - topic: "homeconnect/oven/LWT"
  value_template: &oven_program_bg >-
