name: Test MQTT-NDJSON

on:
  push:
    branches:
      - master
    paths:
      - 'docker/mqtt-ndjson/**'
      - 'docker/modbus-serial/day-file-writer.js'
      - 'docker/modbus-serial/day-file-writer.test.js'
      - 'docker/modbus-serial/test-fixtures/day-file-writer-child.js'
      - '.github/workflows/test-mqtt-ndjson.yml'
  pull_request:
    paths:
      - 'docker/mqtt-ndjson/**'
      - 'docker/modbus-serial/day-file-writer.js'
      - 'docker/modbus-serial/day-file-writer.test.js'
      - 'docker/modbus-serial/test-fixtures/day-file-writer-child.js'
      - '.github/workflows/test-mqtt-ndjson.yml'
  workflow_dispatch:

jobs:
  test:
    name: Test mqtt-ndjson
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: 'docker/mqtt-ndjson/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'docker/mqtt-ndjson/package-lock.json'

      # day-file-writer.js is copied, not shared, between modbus-serial and
      # mqtt-ndjson (separate npm packages). The copies, their test and its
      # harness must stay identical.
      - name: Check the day-file-writer copies are identical
        run: |
          cmp docker/modbus-serial/day-file-writer.js docker/mqtt-ndjson/day-file-writer.js
          cmp docker/modbus-serial/day-file-writer.test.js docker/mqtt-ndjson/day-file-writer.test.js
          cmp docker/modbus-serial/test-fixtures/day-file-writer-child.js docker/mqtt-ndjson/test-fixtures/day-file-writer-child.js

      - name: Install dependencies
        working-directory: docker/mqtt-ndjson
        run: npm ci

      - name: Run tests
        working-directory: docker/mqtt-ndjson
        run: npm test -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        continue-on-error: true
        with:
          directory: docker/mqtt-ndjson/coverage
          flags: mqtt-ndjson
