# The detect-changes suite decides which services CI builds, retags and tags at
# the commit SHA, and until issue #1544 nothing ran it: `ci-unified.yml` invokes
# `npm run detect-changes` (the CLI) and never `npm test`. Its 393 tests -
# including the compose-file coverage tests that guard the deploy contract - were
# green only on a developer's machine.
name: Test Detect Changes

on:
  push:
    branches:
      - master
    paths:
      - '.github/scripts/detect-changes/**'
      - '.github/workflows/test-detect-changes.yml'
      # The coverage tests read the real compose file, so a service added there
      # must re-run them even when the script itself is untouched.
      - 'docker-compose.yml'
  pull_request:
    paths:
      - '.github/scripts/detect-changes/**'
      - '.github/workflows/test-detect-changes.yml'
      - 'docker-compose.yml'
  workflow_dispatch:

jobs:
  test:
    name: Test detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.github/scripts/detect-changes/.nvmrc'
          cache: 'npm'
          cache-dependency-path: '.github/scripts/detect-changes/package-lock.json'

      - name: Install dependencies
        working-directory: .github/scripts/detect-changes
        run: npm ci

      - name: Typecheck
        working-directory: .github/scripts/detect-changes
        run: npm run typecheck

      - name: Run tests
        working-directory: .github/scripts/detect-changes
        run: npm test

      # Coverage is reported, not gated. jest.config.js asks for 80% globally,
      # and branch coverage has never met it - 78.96% at c92cae9, before this
      # workflow existed - because nothing ever ran this suite to find out.
      # Gating here would fail every PR on debt that predates the workflow, and
      # the shortcuts (lowering the threshold, --coverageThreshold='{}') would
      # delete the signal instead of the debt. Tracked in issue #1548, which
      # restores the gate once the gap is closed.
      - name: Collect coverage
        continue-on-error: true
        working-directory: .github/scripts/detect-changes
        run: npm test -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v5
        continue-on-error: true
        with:
          directory: .github/scripts/detect-changes/coverage
          flags: detect-changes
