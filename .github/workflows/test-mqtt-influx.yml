name: Test MQTT-Influx

on:
  push:
    branches:
      - master
    paths:
      - 'docker/mqtt-influx/**'
      - '.github/workflows/test-mqtt-influx.yml'
  pull_request:
    paths:
      - 'docker/mqtt-influx/**'
      - '.github/workflows/test-mqtt-influx.yml'
  workflow_dispatch:

jobs:
  test:
    name: Test mqtt-influx
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: 'docker/mqtt-influx/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'docker/mqtt-influx/package-lock.json'

      - name: Install dependencies
        working-directory: docker/mqtt-influx
        run: npm ci

      - name: Run tests
        working-directory: docker/mqtt-influx
        run: npm test -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        continue-on-error: true
        with:
          directory: docker/mqtt-influx/coverage
          flags: mqtt-influx
