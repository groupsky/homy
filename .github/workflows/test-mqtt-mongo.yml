name: Test MQTT-Mongo

on:
  push:
    branches:
      - master
    paths:
      - 'docker/mqtt-mongo/**'
      - '.github/workflows/test-mqtt-mongo.yml'
  pull_request:
    paths:
      - 'docker/mqtt-mongo/**'
      - '.github/workflows/test-mqtt-mongo.yml'
  workflow_dispatch:

jobs:
  test:
    name: Test mqtt-mongo
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'docker/mqtt-mongo/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'docker/mqtt-mongo/package-lock.json'

      - name: Install dependencies
        working-directory: docker/mqtt-mongo
        run: npm ci

      - name: Run tests
        working-directory: docker/mqtt-mongo
        run: npm test -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v5
        continue-on-error: true
        with:
          directory: docker/mqtt-mongo/coverage
          flags: mqtt-mongo
