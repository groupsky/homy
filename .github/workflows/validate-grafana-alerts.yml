name: Validate Grafana Alerts

# Rejects Grafana provisioning that loads cleanly and is wrong at run time.
#
# 1. Evaluator types Grafana cannot build, in provisioned alert rules. An
#    unsupported type (`gte`, `lte`) does not fail provisioning - the rule is
#    created, looks healthy, and silently never evaluates. Issues #1472, #1475.
# 2. Self-rescaling units on dashboard panels. Grafana's SIPrefix units
#    multiply by 1000 and change their suffix below 1, so a tyre-pressure tile
#    in `pressurebar` shows a flat tyre as `800.00 mbar`. Issue #1481.
#
# NOTE: this is not currently a required status check on `master`. A red result
# reports but does not block merge until it is added to the branch ruleset.

on:
  push:
    paths:
      - 'config/grafana/provisioning/alerting/**'
      - 'config/grafana/dashboards/**'
      - '.github/scripts/validate-grafana-alerts/**'
      - '.github/workflows/validate-grafana-alerts.yml'
  pull_request:
    paths:
      - 'config/grafana/provisioning/alerting/**'
      - 'config/grafana/dashboards/**'
      - '.github/scripts/validate-grafana-alerts/**'
      - '.github/workflows/validate-grafana-alerts.yml'
  workflow_dispatch:

jobs:
  validate-evaluators:
    name: Validate Alert Evaluators and Dashboard Units
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.github/scripts/validate-grafana-alerts/.nvmrc'
          cache: 'npm'
          cache-dependency-path: '.github/scripts/validate-grafana-alerts/package-lock.json'

      - name: Install dependencies
        working-directory: .github/scripts/validate-grafana-alerts
        run: npm ci

      - name: Unit and integration tests
        working-directory: .github/scripts/validate-grafana-alerts
        run: npm test

      - name: Validate alert rule evaluators and dashboard units
        working-directory: .github/scripts/validate-grafana-alerts
        run: npm run validate
