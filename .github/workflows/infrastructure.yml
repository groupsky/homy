name: infrastructure

# Infrastructure validation workflow - tests nginx config generation and service orchestration
# Runs on path-filtered triggers (infrastructure changes) + weekly schedule for validation
on:
  push:
    branches: [master]
    paths:
      - 'docker/nginx/**'
      - 'docker/dockergen/**'
      - 'docker/ingressgen/**'
      - 'config/ingressgen/**'
      - 'docker-compose.yml'
      # The network pin and the trusted-proxy address live here (#1555).
      - 'example.env'
      - '.github/workflows/infrastructure.yml'

  pull_request:
    paths:
      - 'docker/nginx/**'
      - 'docker/dockergen/**'
      - 'docker/ingressgen/**'
      - 'config/ingressgen/**'
      - 'docker-compose.yml'
      # The network pin and the trusted-proxy address live here (#1555).
      - 'example.env'
      - '.github/workflows/infrastructure.yml'

  # Weekly validation (catch indirect failures from base image updates)
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 2 AM UTC

  # Manual debugging/validation
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate resolved compose config
        run: |
          docker compose --env-file example.env --file docker-compose.yml config > resolved-docker-compose.yml

      - name: Build all containers
        uses: docker/bake-action@v6
        with:
          source: .
          files: |
            ./resolved-docker-compose.yml
          set: |
            *.cache-from=type=gha,scope=infrastructure
            *.cache-to=type=gha,mode=max,scope=infrastructure,ignore-error=true
          load: true

      - name: Start containers
        run: |
          docker compose --env-file example.env --file docker-compose.yml up --force-recreate --no-start

      - name: Validate ingress template generation
        run: |
          echo "Creating ingress network and starting ingress container..."
          docker compose --env-file example.env up -d ingress

          echo "Starting test backend services for ingress validation..."
          docker compose --env-file example.env up -d grafana ha

          echo "Waiting for services to be healthy on ingress network..."
          for i in {1..10}; do
            if docker network inspect homy_ingress -f '{{range .Containers}}{{.Name}} {{end}}' | grep -q grafana && \
               docker network inspect homy_ingress -f '{{range .Containers}}{{.Name}} {{end}}' | grep -q ha; then
              echo "✓ Services connected to ingress network after $i seconds"
              break
            fi
            if [ $i -eq 10 ]; then
              echo "WARNING: Services may not be fully connected to network"
            fi
            sleep 1
          done

          # Issue #1555: Home Assistant answers 400 to every proxied request if
          # trusted_proxies does not cover the address nginx reaches it from. The
          # ingress network used to be unpinned, so Docker renumbered it on a
          # network recreate and the stack came up green while every request
          # through the proxy failed. The static wiring is asserted in
          # tests/integration/ingress-proxy-pinning.integration.test.ts; this is
          # the runtime half — that Docker actually honoured the pin.
          echo "Verifying the ingress network pin took effect..."
          # Read each variable in its own step so a missing one names itself,
          # rather than a pipeline whose grep failure `cut` would swallow (the
          # step runs under `bash -e`, not `-eo pipefail`).
          read_env_var() {
            local name="$1" line
            line=$(grep -E "^${name}=" example.env) || {
              echo "FAIL: ${name} is not defined in example.env" >&2
              return 1
            }
            printf '%s' "${line#*=}"
          }
          expected_subnet=$(read_env_var PROXY_BACKEND_SUBNET)
          expected_address=$(read_env_var PROXY_BACKEND_ADDRESS)

          # Separator matters: with a second (e.g. IPv6) ipam entry an unseparated
          # concatenation would silently compare as one nonsense string.
          actual_subnet=$(docker network inspect homy_ingress \
            -f '{{range $i, $c := .IPAM.Config}}{{if $i}},{{end}}{{$c.Subnet}}{{end}}')
          if [ "$actual_subnet" != "$expected_subnet" ]; then
            echo "FAIL: homy_ingress subnet is '$actual_subnet', expected '$expected_subnet'"
            echo "      The ingress network is not pinned as configured."
            exit 1
          fi
          echo "✓ homy_ingress subnet is pinned to $actual_subnet"

          nginx_cid=$(docker compose --env-file example.env ps -q ingress)
          actual_address=$(docker inspect "$nginx_cid" \
            -f '{{(index .NetworkSettings.Networks "homy_ingress").IPAddress}}')
          if [ "$actual_address" != "$expected_address" ]; then
            echo "FAIL: nginx is at '$actual_address' on homy_ingress, expected '$expected_address'"
            exit 1
          fi
          echo "✓ nginx holds its pinned address $actual_address"

          # The invariant that actually matters: what HA trusts must be the
          # address nginx really has, not merely what example.env claims.
          ha_cid=$(docker compose --env-file example.env ps -q ha)
          ha_trusted=$(docker inspect "$ha_cid" \
            -f '{{range .Config.Env}}{{println .}}{{end}}' | grep '^TRUSTED_PROXIES=' | cut -d= -f2-)
          if [ "$ha_trusted" != "$actual_address" ]; then
            echo "FAIL: HA trusts '$ha_trusted' but nginx reaches it from '$actual_address'"
            echo "      Every proxied request would return 400."
            exit 1
          fi
          echo "✓ HA trusts exactly the address nginx proxies from ($ha_trusted)"

          echo "Starting ingressgen to generate nginx config..."
          docker compose --env-file example.env up -d ingressgen

          echo "Waiting for config generation..."
          for i in {1..30}; do
            if [ -f data/ingress/default.conf ] && [ -s data/ingress/default.conf ]; then
              echo "✓ Config file generated after $i seconds"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "ERROR: nginx config was not generated after 30 seconds"
              docker compose --env-file example.env logs ingressgen
              exit 1
            fi
            sleep 1
          done

          echo "Checking for upstream blocks..."
          if ! grep -q "upstream" data/ingress/default.conf; then
            echo "ERROR: No upstream blocks found in generated config"
            cat data/ingress/default.conf
            exit 1
          fi
          echo "✓ Upstream blocks found"

          echo "Checking upstream blocks are not empty..."
          awk '/^upstream /,/^}/' data/ingress/default.conf > upstreams.txt
          if grep -q "upstream" upstreams.txt && ! grep -q "server" upstreams.txt; then
            echo "ERROR: Upstream blocks exist but contain no server entries"
            cat upstreams.txt
            cat data/ingress/default.conf
            exit 1
          fi
          echo "✓ Upstream blocks contain server entries"
          cat upstreams.txt

          echo "Starting nginx and validating syntax..."
          docker compose --env-file example.env up -d ingress

          echo "Waiting for nginx to start..."
          for i in {1..15}; do
            if docker compose --env-file example.env ps ingress | grep -q "Up"; then
              echo "✓ Nginx container started after $i seconds"
              break
            fi
            if [ $i -eq 15 ]; then
              echo "ERROR: Nginx container failed to start after 15 seconds"
              docker compose --env-file example.env logs ingress
              exit 1
            fi
            sleep 1
          done

          docker compose --env-file example.env exec -T ingress nginx -t
          echo "✓ Nginx config syntax is valid"

          echo "Checking ingressgen logs for critical errors..."
          docker compose --env-file example.env logs ingressgen
          echo "✓ Ingress template validation complete"

      - name: Verify a proxied request is not rejected as an untrusted proxy
        run: |
          # Everything above proves the wiring. This proves the outcome, which is
          # the only thing #1555 was ever about: HA returning 400 to every request
          # arriving through nginx. Any *other* status is a pass here — 401, 302
          # and 404 all mean the request was accepted and routed. Only 400 is the
          # signature of trusted_proxies not covering the proxy's address.
          domain=$(docker compose --env-file example.env config \
            --format json | jq -r '.services.ha.environment.VIRTUAL_HOST')
          proxy=$(grep -E '^INGRESS_ADDRESS=' example.env | cut -d= -f2-)
          echo "Requesting http://${proxy}/ with Host: ${domain}"

          status=""
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
              -H "Host: ${domain}" "http://${proxy}/" || echo 000)
            # 000 = no connection yet, 502/503 = nginx up but HA still booting.
            case "$status" in
              000|502|503) sleep 5 ;;
              *) break ;;
            esac
          done

          if [ "$status" = "400" ]; then
            echo "FAIL: proxied request returned 400 — the #1555 signature."
            echo "      HA is rejecting nginx as an untrusted proxy."
            docker compose --env-file example.env logs ha | grep -i "untrusted proxy" | tail -5 || true
            exit 1
          fi
          if [ "$status" = "000" ] || [ "$status" = "502" ] || [ "$status" = "503" ]; then
            echo "FAIL: backend never became reachable through nginx (last status: $status)."
            docker compose --env-file example.env logs ha | tail -30
            exit 1
          fi
          echo "✓ Proxied request returned $status — accepted and routed, not rejected as an untrusted proxy"
